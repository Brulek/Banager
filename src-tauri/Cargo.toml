[package]
name = "canager"
version = "0.1.0"
description = "A friendly manager for everything you installed from the terminal"
authors = ["Brulek"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "canager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
canager-core = { path = "../crates/canager-core" }
# Pinned to an explicit rev (not just whatever Cargo.lock happens to resolve
# to): this is a git dependency with no published version, so without a
# pinned rev it is the one dependency that could change under us -- on a
# `cargo update` or a fresh checkout without Cargo.lock -- with no version
# bump to signal it, which matters for a signed release. The rev below is
# what Cargo.lock currently resolves to.
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }


[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Same crate as the plain `canager-core` entry under [dependencies] above,
# with `test-support` turned on: resolver v2 unifies features per target,
# so this only reaches the test build of canager-core, never the release
# binary's. This is what lets `ipc.rs`'s tests call
# `canager_core::testing::expire_issued_plans`, which is cfg-gated on that
# feature specifically so it cannot ship in a release build. See
# `crates/canager-core/src/testing.rs`.
canager-core = { path = "../crates/canager-core", features = ["test-support"] }

# [profile.release] lives at the workspace root (../Cargo.toml), not here --
# Cargo only reads profiles from the workspace root; a copy in this member
# crate's Cargo.toml is silently ignored. See the comment there for why
# `panic = "abort"` is deliberately left out.
